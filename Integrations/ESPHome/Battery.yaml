external_components:
  - source: github://ApolloAutomation/esphome-battery-component
    components: [max17048] #Forked OptionZero
  - source: github://bharvey88/esphome@aht10-init-retry-wedgetest
    components: [aht10] #TEMPORARY wedge-simulation branch for rescue testing
    refresh: 0s

esphome:
  on_boot:
    # AHT20 rescue: if the sensor is still failing init 2s in (the aht10
    # component retries for 5s), power-cycle the accessory rail so the chip
    # gets a clean power-on reset. Battery units never fully lose power, so
    # a wedged AHT20 otherwise stays wedged until the battery is pulled.
    - priority: -100.0
      then:
        - delay: 2s
        - if:
            condition:
              lambda: 'return id(aht_20).status_has_warning();'
            then:
              - logger.log:
                  level: WARN
                  format: "AHT20 not responding, power-cycling accessory rail"
              - switch.turn_off: accessory_power
              - delay: 500ms
              - switch.turn_on: accessory_power

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 12h
  run_duration: 90s

sensor:
  - platform: max17048
    id: max_17048
    battery_voltage:
      name: Battery voltage
      id: batt_v
    battery_level:
      name: Battery level
      id: batt_pct
      filters:
        - lambda: |
            if (x > 100) return 100;
            else return (x);

switch:
  - platform: gpio
    pin: GPIO7
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 5000
    entity_category: CONFIG
number:
  
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 0.01
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 12
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "h"
    on_value:
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(x * 60 * 60 * 1000);

script:
  - id: reportAllValues
    then:
      - component.update: soil_temperature
      - component.update: soil_moisture
      - component.update: aht_20
      - component.update: ltr_390
      - component.update: wifi_signal_db
      - component.update: sys_esp_temperature
      - component.update: sys_uptime
      - component.update: soil_adc
      - component.update: max_17048
